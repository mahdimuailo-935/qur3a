<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15121d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="القرعة">
<title>قرعة الأصابع</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap">
<style>
/* VOICE   a party game for friends around one phone: quick, playful, nothing to read twice
   IDEA    a night game table: pick the game from three tokens, then the whole screen becomes the table
   PICTURE the live arena: a ring under each finger, countdown arcs, then the verdict drawn on the table
   COLOUR  ink-violet table #15121d, ten bright token colours, team red #ff3d55 and team blue #2f80ff
   TYPE    Readex Pro 700 for titles and rank numbers, Readex Pro 400/500 for labels
   LAYOUT  start screen: title, three large mode cards, wait-time switch; game: full-screen arena, small back button */
:root{color-scheme:dark;--bg:#15121d;--panel:#1e1929;--ink:#f6f3ff;--mute:#aaa3bf;--line:#2f2942;--red:#ff3d55;--blue:#2f80ff}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#menu{min-height:100%;display:flex;flex-direction:column;gap:22px;max-width:560px;margin:0 auto;padding:32px 18px 24px}
#menu h1{margin:0;font-size:clamp(32px,9vw,44px);line-height:1.05;font-weight:700;letter-spacing:-.02em}
#menu .lead{margin:6px 0 0;color:var(--mute);font-size:16px}
.cards{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:16px;width:100%;min-height:100px;padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--panel);text-align:start;transition:transform .12s,background .2s}
.card:active{transform:scale(.98);background:#272135}
.card .ic{flex:none;display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.card .ic svg{width:32px;height:32px}
.card b{display:block;font-size:20px;line-height:1.25;font-weight:700}
.card small{display:block;margin-top:3px;color:var(--mute);font-size:14px;line-height:1.45}
.card .go{flex:none;width:22px;height:22px;margin-inline-start:auto;color:var(--mute)}
.dur{display:grid;gap:10px;margin-top:auto}
.dur>span{color:var(--mute);font-size:15px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.seg button{min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-size:15px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none}
#arena{position:absolute;inset:0;overflow:hidden;background:radial-gradient(110% 80% at 50% 50%,#251f36 0%,#191424 55%,#120f19 100%);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#back{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px 0 14px;border:1px solid var(--line);border-radius:22px;background:rgba(30,25,41,.88);font-size:15px;font-weight:500;transition:opacity .2s}
#back svg{width:18px;height:18px}
body.busy #back{opacity:0;pointer-events:none}
#idle{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;padding:24px;text-align:center;pointer-events:none;transition:opacity .25s}
#idle.hide,#status.hide{opacity:0}
.ghosts{position:relative;width:184px;height:118px;margin-bottom:14px}
.ghosts i{position:absolute;width:64px;height:64px;border-radius:50%;border:6px solid currentColor;box-shadow:0 0 0 12px color-mix(in srgb,currentColor 16%,transparent);animation:breathe 2.4s ease-in-out infinite}
.ghosts i::after{content:"";position:absolute;inset:9px;border-radius:50%;background:currentColor}
.ghosts i:nth-child(1){right:6px;top:48px;color:#ff5d73}
.ghosts i:nth-child(2){right:60px;top:6px;color:#ffe14d;animation-delay:.4s}
.ghosts i:nth-child(3){right:114px;top:48px;color:#3ddbd9;animation-delay:.8s}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.ghosts i{animation:none}.card{transition:none}}
#idle strong{font-size:clamp(28px,7.5vw,40px);line-height:1.08;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
#idle p{margin:0;max-width:32ch;font-size:16px;text-wrap:balance}
#idle .sub{color:var(--mute);font-size:15px}
#status{position:absolute;top:68px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:max-content;max-width:calc(100% - 24px);padding:8px 18px;border-radius:20px;background:rgba(12,10,18,.8);text-align:center;font-size:16px;font-weight:500;pointer-events:none;transition:opacity .2s}
#status small{color:var(--mute);font-size:13px;font-weight:400}
#status small:empty{display:none}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pill{padding:2px 12px;border-radius:12px;color:#fff;font-weight:700;white-space:nowrap}
.pill.r{background:var(--red)}
.pill.b{background:var(--blue)}
</style>
</head>
<body>
<section id="menu">
  <div>
    <h1>قرعة الأصابع</h1>
    <p class="lead">اختر نوع القرعة</p>
  </div>
  <div class="cards">
    <button class="card" type="button" id="c-one" data-m="one" style="--c:#ffe14d">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3.6" fill="currentColor"/></svg></span>
      <span><b>شخص واحد</b><small>يبقى إصبع واحد فقط، وهو المختار</small></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="card" type="button" id="c-order" data-m="order" style="--c:#3ddbd9">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 20.5h18"/><rect x="9" y="5" width="6" height="15.5" rx="1"/><rect x="3" y="11" width="6" height="9.5" rx="1"/><rect x="15" y="14" width="6" height="6.5" rx="1"/></svg></span>
      <span><b>ترتيب</b><small>يأخذ كل إصبع رقمًا من 1 إلى عدد المشاركين</small></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="card" type="button" id="c-teams" data-m="teams" style="--c:#2f80ff">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="5.2" fill="#ff3d55"/><circle cx="16" cy="12" r="5.2" fill="#2f80ff"/></svg></span>
      <span><b>فريقان</b><small>ينقسم الجميع إلى أحمر وأزرق بالتساوي</small></span>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>
  <div class="dur">
    <span>مدة الانتظار قبل النتيجة</span>
    <div class="seg" id="durSeg" role="group" aria-label="مدة الانتظار">
      <button type="button" id="d-1" data-d="1" aria-pressed="false">ثانية</button>
      <button type="button" id="d-2" data-d="2" aria-pressed="true">ثانيتان</button>
      <button type="button" id="d-3" data-d="3" aria-pressed="false">3 ثوانٍ</button>
      <button type="button" id="d-5" data-d="5" aria-pressed="false">5 ثوانٍ</button>
    </div>
  </div>
</section>
<div id="game" hidden>
  <main id="arena">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div id="idle">
      <div class="ghosts" aria-hidden="true"><i></i><i></i><i></i></div>
      <strong>ضعوا أصابعكم في أي مكان على الشاشة</strong>
      <p id="idleMode">يبقى إصبع واحد فقط، وهو المختار</p>
      <p class="sub" id="idleSub">تظهر النتيجة بعد ثانيتين من ثبات الأصابع</p>
    </div>
    <div id="status" class="hide" role="status" aria-live="polite"><span id="stMain"></span><small id="stHint"></small></div>
  </main>
  <button id="back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>رجوع</button>
</div>
<script>
{
const $=id=>document.getElementById(id);
const menu=$('menu'),game=$('game'),arena=$('arena'),cv=$('cv'),ctx=cv.getContext('2d'),idle=$('idle'),statusEl=$('status'),stMain=$('stMain'),stHint=$('stHint');
const backBtn=$('back'),idleMode=$('idleMode'),idleSub=$('idleSub');
const cards=[...document.querySelectorAll('.card')],durBtns=[...document.querySelectorAll('#durSeg button')];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const PAL=['#ff5d73','#ffb020','#ffe14d','#9be15d','#3ddbd9','#5aa9ff','#b69cff','#ff8fd1','#ff7a3d','#53e3a6'].map(hex);
const RED=hex('#ff3d55'),BLUE=hex('#2f80ff'),WHITE=[255,255,255];
const DURS=[1,2,3,5];
const DUR_AFTER={1:'بعد ثانية',2:'بعد ثانيتين',3:'بعد 3 ثوانٍ',5:'بعد 5 ثوانٍ'};
const MODE_TEXT={one:'يبقى إصبع واحد فقط، وهو المختار',order:'يأخذ كل إصبع رقمًا من 1 إلى عدد المشاركين',teams:'ينقسم الجميع إلى أحمر وأزرق بالتساوي'};
const TAU=Math.PI*2,BORN=320,DIE=260;
const clamp01=v=>v<0?0:v>1?1:v;
const easeOut=v=>1-(1-v)**3;
const easeBack=v=>{const c=1.70158;return 1+(c+1)*(v-1)**3+c*(v-1)**2};
const lerp=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const col=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const rnd=n=>{const C=window.crypto;if(C&&C.getRandomValues){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{C.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const people=n=>n===2?'مشاركان':n<=10?n+' مشاركين':n+' مشاركًا';
const fingersWord=n=>n<=10?n+' أصابع':n+' إصبعًا';

let mode='one',dur=2;
try{const m=localStorage.getItem('qr-mode'),d=+localStorage.getItem('qr-dur');if(MODE_TEXT[m])mode=m;if(DURS.includes(d))dur=d}catch(e){}
const save=()=>{try{localStorage.setItem('qr-mode',mode);localStorage.setItem('qr-dur',String(dur))}catch(e){}};

let fingers=[],phase='gather',lastChange=0,revealAt=0,winner=null,cancelAt=0,cancelN=0,W=0,H=0,dpr=1,R=50,raf=0;
const down=new Set();
const now=()=>performance.now();
const active=()=>fingers.filter(f=>!f.dying);
const pickColor=()=>{const used=new Set(active().map(f=>f.ci)),all=PAL.map((_,i)=>i),free=all.filter(i=>!used.has(i)),pool=free.length?free:all;return pool[rnd(pool.length)]};

function kick(){if(!raf)raf=requestAnimationFrame(frame)}
function lift(f,t0){if(phase==='gather'){f.dying=t0;lastChange=t0}else f.lifted=true}
function sync(e,t0){
  const live=new Set(Array.from(e.touches,t=>t.identifier));
  for(const id of [...down])if(!live.has(id))down.delete(id);
  for(const f of fingers)if(!f.dying&&!f.lifted&&!live.has(f.id))lift(f,t0);
}
function onStart(e){
  e.preventDefault();
  const t0=now(),r=arena.getBoundingClientRect();
  sync(e,t0);
  if(phase==='result'){
    if(down.size||t0-revealAt<900){for(const t of e.changedTouches)down.add(t.identifier);changed();return}
    fingers=[];phase='gather';winner=null;
  }
  for(const t of e.changedTouches){
    down.add(t.identifier);
    const ci=pickColor();
    fingers.push({id:t.identifier,x:t.clientX-r.left,y:t.clientY-r.top,ci,col:PAL[ci],born:t0,dying:0,lifted:false,rank:0,team:-1,seq:0});
  }
  lastChange=t0;cancelAt=0;changed();
}
function onMove(e){
  e.preventDefault();
  const r=arena.getBoundingClientRect();
  for(const t of e.changedTouches){const f=fingers.find(f=>f.id===t.identifier&&!f.dying&&!f.lifted);if(f){f.x=t.clientX-r.left;f.y=t.clientY-r.top}}
  kick();
}
function onEnd(e){
  e.preventDefault();
  const t0=now(),before=active().filter(f=>!f.lifted).length;
  for(const t of e.changedTouches){down.delete(t.identifier);const f=fingers.find(f=>f.id===t.identifier&&!f.dying&&!f.lifted);if(f)lift(f,t0)}
  sync(e,t0);
  if(e.type==='touchcancel'&&phase==='gather'&&before>=5){cancelAt=t0;cancelN=before;setTimeout(updateStatus,4100)}
  changed();
}
function changed(){
  idle.classList.toggle('hide',active().length>0);
  document.body.classList.toggle('busy',down.size>0);
  updateStatus();kick();
}
function updateStatus(){
  const act=active(),n=act.length;let main='',hint='',html=false;
  if(phase==='gather'){
    if(n===1){main='إصبع واحد';hint='ننتظر إصبعًا آخر على الأقل'}
    else if(n>1){main=people(n);hint=mode==='teams'&&n%2?'العدد فردي، فسيزيد أحد الفريقين بشخص':'اثبتوا، النتيجة '+DUR_AFTER[dur]}
    else if(cancelAt&&now()-cancelAt<4000){main='توقفت اللمسات';hint='قد لا يقبل جوالك أكثر من '+fingersWord(cancelN)+' معًا'}
  }else{
    if(mode==='one')main='وقع الاختيار';
    else if(mode==='order')main='الترتيب من 1 إلى '+n;
    else{const red=act.filter(f=>f.team===0).length;html=true;main=`<span class="pills"><span class="pill r">الأحمر ${red}</span><span class="pill b">الأزرق ${n-red}</span></span>`}
    if(!down.size)hint='المسوا الشاشة لقرعة جديدة';
  }
  if(html)stMain.innerHTML=main;else stMain.textContent=main;
  stHint.textContent=hint;
  statusEl.classList.toggle('hide',!main);
}
function reveal(t){
  const act=active();phase='result';revealAt=t;
  const order=shuffle(act.slice());
  if(mode==='one'){winner=order[0];for(const f of act)if(f!==winner)f.dying=t}
  else if(mode==='order')order.forEach((f,i)=>{f.rank=i+1});
  else{const s=rnd(2);order.forEach((f,i)=>{f.team=(i+s)%2;f.seq=i})}
  try{if(navigator.vibrate)navigator.vibrate(mode==='one'?[30,50,30]:35)}catch(e){}
  changed();
}
function frame(t){
  raf=0;
  if(phase==='gather'&&active().length>=2&&t-lastChange>=dur*1000)reveal(t);
  const before=fingers.length;
  fingers=fingers.filter(f=>!f.dying||t-f.dying<DIE);
  if(fingers.length!==before)changed();
  draw(t);
  if(phase==='gather'?fingers.length>0:(down.size>0||t-revealAt<3000))kick();
}
function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const counting=phase==='gather'&&active().length>=2,prog=counting?clamp01((t-lastChange)/(dur*1000)):0;
  if(phase==='result'&&mode==='one'&&winner){
    const k=easeOut(clamp01((t-revealAt)/700)),far=Math.hypot(W,H)+R,hole=far+(R*2.1-far)*k;
    ctx.fillStyle=col(winner.col,.9);
    ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(winner.x,winner.y,hole,0,TAU);ctx.fill('evenodd');
  }
  for(const f of fingers)drawFinger(f,t,counting,prog);
}
function drawFinger(f,t,counting,prog){
  let s=easeBack(clamp01((t-f.born)/BORN)),a=1;
  if(f.dying){const d=clamp01((t-f.dying)/DIE);s*=1-easeOut(d);a=1-d}
  if(s<=.01)return;
  if(phase==='gather'&&!f.dying)s*=1+Math.sin((t-f.born)/(counting?150:330))*.04;
  if(f===winner)s*=1+.2*easeBack(clamp01((t-revealAt)/520));
  let c=f.col;
  if(f.team>=0)c=lerp(f.col,f.team?BLUE:RED,easeOut(clamp01((t-revealAt-f.seq*70)/380)));
  const r=R*s,x=f.x,y=f.y;
  ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x,y,r*.6,x,y,r*1.9);
  g.addColorStop(0,col(c,.42));g.addColorStop(1,col(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.9,0,TAU);ctx.fill();
  ctx.lineWidth=Math.max(5,r*.13);ctx.strokeStyle=col(c,1);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  const cg=ctx.createRadialGradient(x-r*.2,y-r*.25,r*.05,x,y,r*.64);
  cg.addColorStop(0,col(lerp(c,WHITE,.4),1));cg.addColorStop(1,col(c,1));
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x,y,r*.62,0,TAU);ctx.fill();
  if(counting&&!f.dying){
    ctx.lineCap='round';ctx.lineWidth=4;
    ctx.strokeStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.arc(x,y,r+13,0,TAU);ctx.stroke();
    if(prog>0){ctx.strokeStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(x,y,r+13,-Math.PI/2,-Math.PI/2+TAU*prog);ctx.stroke()}
  }
  if(f.rank)drawBadge(f,t,c,r);
  ctx.globalAlpha=1;
}
function drawBadge(f,t,c,r){
  const k=clamp01((t-revealAt-(f.rank-1)*120)/300);if(k<=0)return;
  const br=Math.max(17,R*.36)*easeBack(k),gap=br+12;
  let by=f.y-r-gap;if(by<br+6)by=f.y+r+gap;
  const bx=Math.min(W-br-6,Math.max(br+6,f.x));
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,br,0,TAU);ctx.fill();
  ctx.lineWidth=3.5;ctx.strokeStyle=col(c,1);ctx.stroke();
  ctx.fillStyle='#15121d';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`700 ${Math.max(1,Math.round(br*(f.rank>9?.95:1.2)))}px "Readex Pro",system-ui,sans-serif`;
  ctx.fillText(String(f.rank),bx,by+br*.06);
}
function resize(){
  const r=arena.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));
  R=Math.max(40,Math.min(58,Math.min(W,H)*.13));draw(now());kick();
}
function renderDur(){durBtns.forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.d===dur)));idleSub.textContent='تظهر النتيجة '+DUR_AFTER[dur]+' من ثبات الأصابع'}
function reset(){fingers=[];down.clear();phase='gather';winner=null;cancelAt=0;changed()}
function startGame(m){
  mode=m;save();idleMode.textContent=MODE_TEXT[mode];reset();
  menu.hidden=true;game.hidden=false;
  try{if(location.hash!=='#play')history.pushState({play:1},'','#play')}catch(e){}
  resize();
}
function toMenu(){reset();game.hidden=true;menu.hidden=false}

cards.forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.m)));
durBtns.forEach(b=>b.addEventListener('click',()=>{dur=+b.dataset.d;save();renderDur()}));
backBtn.addEventListener('click',()=>{if(down.size)return;if(location.hash==='#play')history.back();else toMenu()});
addEventListener('popstate',()=>{if(!game.hidden)toMenu()});
const opt={passive:false};
arena.addEventListener('touchstart',onStart,opt);
arena.addEventListener('touchmove',onMove,opt);
arena.addEventListener('touchend',onEnd,opt);
arena.addEventListener('touchcancel',onEnd,opt);
game.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)return;down.clear();if(phase==='gather')fingers=[];else fingers.forEach(f=>{f.lifted=true});changed()});
const ro=new ResizeObserver(resize);ro.observe(arena);
if(location.hash==='#play'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
renderDur();
if(document.fonts)document.fonts.ready.then(kick);
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
